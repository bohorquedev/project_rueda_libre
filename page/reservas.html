    .caja {
      border: 2px solid #444;
      border-radius: 8px;
      background: #fff;
    }
    .form-control,
    .form-select {
      border: 2px solid #666;
      border-radius: 6px;
      min-height: 44px;
    }
    .form-label { font-weight: 700; font-size: .875rem; }
    .form-check-input { width: 1.25rem; height: 1.25rem; border: 2px solid #666; }
    .btn-reservar {
      background: #222; color: #fff;
      border: 2px solid #222; border-radius: 6px;
      min-height: 48px; font-weight: 700;
    }
    .btn-reservar:hover { background: #000; color: #fff; }
  </style>
   <link rel="stylesheet" href="../style/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-md bg-white border border-2 border-dark-subtle rounded-3 px-3">

    </div>

    </header>
        <div style=" font-weight: bold;
    margin-left: 20vw;
    gap: 20px;">
            <h1>Reserva tu bicicleta</h1>
            <span style="margin: 20px;
    padding: 5px;
    border: 2px solid ;
    border-radius: 5px;
    background-color: #F5F5F5">1- Sede y fecha</span>
            <span style="margin: 20px;
    padding: 5px;
    border: 2px solid ;
    border-radius: 5px;
    background-color: #F5F5F5">2- Bicicleta</span>
            <span style="margin: 20px;
    padding: 5px;
    border: 2px solid ;
    border-radius: 5px;
    background-color: #F5F5F5">3- Tus Datos</span>
        </div>
    
    <main class="container py-4<">
      
        

    <form action="#" method="post" novalidate>
      <div id="contenedor-form">

        <div class="col-lg-8">

          <section class="caja p-4 mb-4" id="fechas">
            <h2 class="h5 mb-3">1. Fechas y sede</h2>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="sede" class="form-label">Sede de recogida</label>
                <select id="sede" name="sede" class="form-select" required>
                  <option value="" selected>Selecciona una sede</option>
                  <option value="1">[SEDE 1]</option>
                  <option value="2">[SEDE 2]</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="hora" class="form-label">Hora de recogida</label>
                <input type="time" id="hora" name="hora" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label for="inicio" class="form-label">Fecha de inicio</label>
                <input type="date" id="inicio" name="inicio" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label for="fin" class="form-label">Fecha de fin</label>
                <input type="date" id="fin" name="fin" class="form-control" required>
              </div>
            </div>
          </section>

          <section class="caja p-4 mb-4" id="bicicleta">
            <h2 class="h5 mb-3">2. Elige tu bicicleta</h2>
            <div class="row g-3">

              <div class="col-sm-6 col-xl-4">
                <input type="radio" class="btn-check" name="bici" id="bici1" value="1" required>
                <label class="btn btn-outline-dark w-100 text-start p-3" for="bici1">
                  <strong class="d-block">[NOMBRE BICI]</strong>
                  <span class="small d-block">[TIPO] · [TALLA]</span>
                  <strong>[PRECIO] / día</strong>
                </label>
              </div>

              <div class="col-sm-6 col-xl-4">
                <input type="radio" class="btn-check" name="bici" id="bici2" value="2">
                <label class="btn btn-outline-dark w-100 text-start p-3" for="bici2">
                  <strong class="d-block">[NOMBRE BICI]</strong>
                  <span class="small d-block">[TIPO] · [TALLA]</span>
                  <strong>[PRECIO] / día</strong>
                </label>
              </div>

              <div class="col-sm-6 col-xl-4">
                <input type="radio" class="btn-check" name="bici" id="bici3" value="3">
                <label class="btn btn-outline-dark w-100 text-start p-3" for="bici3">
                  <strong class="d-block">[NOMBRE BICI]</strong>
                  <span class="small d-block">[TIPO] · [TALLA]</span>
                  <strong>[PRECIO] / día</strong>
                </label>
              </div>

            </div>
          </section>

          <section class="caja p-4" id="datos">
            <h2 class="h5 mb-3">3. Tus datos</h2>
            <div class="row g-3">
              <div class="col-md-4">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" class="form-control" autocomplete="name" required>
              </div>
              <div class="col-md-4">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" id="correo" name="correo" class="form-control" autocomplete="email" required>
              </div>
              <div class="col-md-4">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" class="form-control" autocomplete="tel" required>
              </div>
              <div class="col-12">
                <label for="notas" class="form-label">Notas (opcional)</label>
                <textarea id="notas" name="notas" class="form-control" rows="3"></textarea>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="terminos" name="terminos" required>
                  <label class="form-check-label small" for="terminos">
                    Acepto los términos y condiciones de alquiler
                  </label>
                </div>
              </div>
            </div>
          </section>
        </div>

        <aside class="col-lg-4 c" >
          <div class="caja p-4 sticky-lg-top" style="top: 1rem; color: #000;">
            <h2 class="h5 mb-3">Resumen</h2>

            <p class="small fw-bold mb-2">Extras</p>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="casco" name="extras" value="casco">
              <label class="form-check-label small" for="casco">Casco · [PRECIO]</label>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="candado" name="extras" value="candado">
              <label class="form-check-label small" for="candado">Candado · [PRECIO]</label>
            </div>

            <hr>
            <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
              <span>Total</span><span>[TOTAL]</span>
            </div>

            <button type="button" class="btn btn-reservar w-100">Confirmar reserva</button>
            <p class="small text-secondary mt-2 mb-0">[POLÍTICA DE CANCELACIÓN]</p>
          </div>
        </aside>

      </div>
    </form>
    
    </main>
    <footer class="p-2 mt-4">
  <div class="bg-white text-dark border border-2 border-dark-subtle rounded-3 px-3 py-3">
    <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 small">

        <li><a class="link-dark" href="#">INSTAGRAM</a></li>

      <span>© 2026 Rueda Libre </span>

    </div>
